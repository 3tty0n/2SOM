# -*- mode: yaml -*-
default_experiment: all
default_data_file: 'runbench_experiment.data'

runs:
  max_invocation_time: 6000
  min_iteration_time: 1

benchmark_suites:
    macro-steady:
      gauge_adapter: RebenchLog
      command: &MACRO_STEADY "--jit function_threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/Json:Examples/Benchmarks/GraphSearch Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [7000]
      iterations: 2000
      invocations: 5
      benchmarks:
        - Json:         {extra_args:    80}
        - PageRank:     {extra_args:    1000}
        - GraphSearch:  {extra_args:    30}

    micro-steady:
      gauge_adapter: RebenchLog
      command: &MICRO_STEADY "--jit function_threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/NBody:Examples/Benchmarks/LanguageFeatures:Examples/Benchmarks/TestSuite Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [1669]
      iterations: 2000
      invocations: 5
      benchmarks:
        - Bounce:         {extra_args:    3000}
        - BubbleSort:     {extra_args:    3000}
        - Fannkuch:       {extra_args:      9}
        - Fibonacci:      {extra_args:    1000}
        - List:           {extra_args:    1000, variable_values: [100000]}
        - Mandelbrot:     {extra_args:    1000}
        - NBody:          {extra_args:    250000}
        - Permute:        {extra_args:    1500, variable_values: [10000]}
        - Queens:         {extra_args:    1000}
        - QuickSort:      {extra_args:    2000}
        - Recurse:        {extra_args:    2000}
        - Sieve:          {extra_args:    2500}
        - Storage:        {extra_args:    1000}
        - Sum:            {extra_args:    5000}
        - TreeSort:       {extra_args:    1000}
        - Towers:         {extra_args:    1000, variable_values: [200000]}

    # --- warmup benchmarking ----------------------------------------------------
    # Many invocations of a SHORT iteration run: the RebenchLog adapter records each
    # of the %(iterations)s harness iterations, so averaging over `invocations`
    # process runs yields a smooth per-iteration warmup curve (cold-start spike ->
    # steady state). `warmup` annotates the iterations 2SOM spends reaching steady
    # (it stabilises within a handful of iterations), so analysis tools can drop
    # them when reporting steady numbers. Feed the resulting .data to
    # visualize_results.py for the warmup and break-even (cumulative-time) plots.
    # Counts are tuned for a sane wall-clock; scale invocations up for tighter CIs.
    micro-warmup:
      gauge_adapter: RebenchLog
      command: *MICRO_STEADY
      variable_values: [1669]
      iterations: 120
      invocations: 10
      warmup: 10
      benchmarks:
        - Bounce:         {extra_args:    3000}
        - BubbleSort:     {extra_args:    3000}
        - Fannkuch:       {extra_args:      9}
        - Fibonacci:      {extra_args:    1000}
        - List:           {extra_args:    1000, variable_values: [100000]}
        - Mandelbrot:     {extra_args:    1000}
        - NBody:          {extra_args:    250000}
        - Permute:        {extra_args:    1500, variable_values: [10000]}
        - Queens:         {extra_args:    1000}
        - QuickSort:      {extra_args:    2000}
        - Recurse:        {extra_args:    2000}
        - Sieve:          {extra_args:    2500}
        - Storage:        {extra_args:    1000}
        - Sum:            {extra_args:    5000}
        - TreeSort:       {extra_args:    1000}
        - Towers:         {extra_args:    1000, variable_values: [200000]}

    macro-warmup:
      gauge_adapter: RebenchLog
      command: *MACRO_STEADY
      variable_values: [7000]
      iterations: 120
      invocations: 10
      warmup: 10
      benchmarks:
        - Json:         {extra_args:    80}
        - PageRank:     {extra_args:    1000}
        - GraphSearch:  {extra_args:    30}

    experiment-shuffle:
      gauge_adapter: PlainSecondsLog
      command: &EXPERIMENT_CMD "-cp Smalltalk:Examples/Benchmarks:Examples/Benchmarks/NBody:Examples/Benchmarks/Json:Examples/Benchmarks/DeltaBlue:Examples/Benchmarks/CD Examples/Benchmarks/Experiment/%(benchmark)s.som"
      invocations: 500
      benchmarks:
        - Experiment1
        - Experiment2
        - Experiment3
        - Experiment4
        - Experiment5
        - Experiment6
        - Experiment7
        - Experiment8
        - Experiment9
        - Experiment10
        - Experiment11
        - Experiment12
        - Experiment13
        - Experiment14
        - Experiment15
        - Experiment16
        - Experiment17
        - Experiment18
        - Experiment19
        - Experiment20
        - ExperimentRandom

    experiment-stable:
      gauge_adapter: PlainSecondsLog
      command: &EXPERIMENT_STABLE_CMD "-cp Smalltalk:Examples/Benchmarks:Examples/Benchmarks/NBody:Examples/Benchmarks/Json:Examples/Benchmarks/DeltaBlue:Examples/Benchmarks/CD Examples/Benchmarks/ExperimentStable/%(benchmark)s.som %(iterations)s"
      invocations: 500
      iterations: 100
      benchmarks:
        - ExperimentStable1
        - ExperimentStable2
        - ExperimentStable3
        - ExperimentStable4
        - ExperimentStable5
        - ExperimentStable6
        - ExperimentStable7
        - ExperimentStable8
        - ExperimentStable9
        - ExperimentStable10
        - ExperimentStable11
        - ExperimentStable12
        - ExperimentStable13
        - ExperimentStable14
        - ExperimentStable15
        - ExperimentStable16
        - ExperimentStable17
        - ExperimentStable18
        - ExperimentStable19
        - ExperimentStable20

executors:
    RPySOM-bc-jit-tier1:
        path: .
        executable: som-bc-jit-tier1
        args: --jit function_threshold=1000
    RPySOM-bc-jit-tier1-no-ic:
        path: .
        executable: som-bc-jit-tier1-no-ic
    RPySOM-bc-jit-tier1-no-ic-no-handler-opt:
        path: .
        executable: som-bc-jit-tier1-no-ic-no-handler-opt
    # NOTE: tier numbering realigned to the TLA scheme. som-bc-jit-tier2 is now the
    # STACK INLINER (was tracing); tracing is som-bc-jit-tier3, adaptive hybrid is
    # som-bc-jit-tier4.
    RPySOM-bc-jit-tier2:
        path: .
        executable: som-bc-jit-tier2
    RPySOM-bc-jit-tier3:
        path: .
        executable: som-bc-jit-tier3
    RPySOM-bc-jit-tier4:
        path: .
        executable: som-bc-jit-tier4
    # tier 5 (adaptive inlining with a quiescence-gated warmup phase): a runtime
    # mode of the tier-3 binary. The warmup phase ends when the JIT quiesces (no
    # tracing for SOM_T5_QUIESCE activations or SOM_T5_QUIESCE_GC minor GCs);
    # all cheap-phase compiled code is then purged and hot loops retrace fully
    # inlined.
    # (the recorded .data rows for tier5 were measured with the earlier 400ms-timer build)
    RPySOM-bc-jit-tier5:
        path: .
        executable: som-bc-jit-tier5
        env:
            SOM_T5: "1"
    RPySOM-bc-jit-tier2-high-threshold:
        path: .
        args: --jit function_threshold=7000
        executable: som-bc-jit-tier2
    RPySOM-bc-interp-w-prof:
        path: .
        args: --jit off
        executable: som-bc-jit-tier1
    RPySOM-bc-interp:
        path: .
        executable: som-bc-interp-tier1
    RPySOM-bc-jit-hybrid:
        path: .
        executable: som-bc-jit-hybrid
        args: --jit threshold=57
    RPySOM-bc-jit-hybrid-exp:
        path: .
        executable: som-bc-jit-hybrid
        args: --jit function_threshold=8000

experiments:
  PySOM:
    description: All benchmarks on RPySOM
    executions:
      #- RPySOM-bc-jit-tier1:
      #    suites:
      #      - experiment-shuffle
      # tier3 (tracing baseline) vs tier4 (adaptive tier2-warm/tier3/tier4):
      # the warmup comparison for the adaptive stack-inliner experiments.
      - RPySOM-bc-jit-tier3:
          suites:
            - micro-steady
            - macro-steady
            - experiment-shuffle
            - experiment-stable
      - RPySOM-bc-jit-tier4:
          suites:
            - micro-steady
            - macro-steady
            - experiment-shuffle
            - experiment-stable
      - RPySOM-bc-jit-tier5:
          suites:
            - experiment-shuffle
            - experiment-stable
      - RPySOM-bc-jit-tier2:
          suites:
            - micro-steady
            - macro-steady
            - experiment-shuffle
            - experiment-stable
      - RPySOM-bc-jit-tier2-high-threshold:
          suites:
            - experiment-shuffle
            - experiment-stable
      #- RPySOM-bc-interp:
      #    suites:
      #      - experiment-shuffle
      #- RPySOM-bc-interp-w-prof:
      #    suites:
      #      - experiment-shuffle
      - RPySOM-bc-jit-hybrid:
          suites:
            - micro-steady
            - macro-steady
      - RPySOM-bc-jit-hybrid-exp:
          suites:
            - experiment-shuffle
            - experiment-stable

  # Run with:  rebench runbench_experiment.conf Warmup
  # or a subset:  rebench runbench_experiment.conf s:micro-warmup e:RPySOM-bc-jit-tier4
  Warmup:
    description: Per-iteration warmup curves (tier2 inliner vs tier3 tracing vs tier4 adaptive)
    executions:
      - RPySOM-bc-jit-tier3:
          suites:
            - micro-warmup
            - macro-warmup
      - RPySOM-bc-jit-tier4:
          suites:
            - micro-warmup
            - macro-warmup
      - RPySOM-bc-jit-tier5:
          suites:
            - micro-warmup
            - macro-warmup
      - RPySOM-bc-jit-tier2:
          suites:
            - micro-warmup
            - macro-warmup
