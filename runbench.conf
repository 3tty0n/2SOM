# -*- mode: yaml -*-
default_experiment: all
default_data_file: 'runbench.data'

runs:
  max_invocation_time: 6000
  min_iteration_time: 1
  iterations: 100
  invocations: 30

benchmark_suites:
    macro-steady:
      gauge_adapter: RebenchLog
      command: &MACRO_STEADY "--jit function_threshold=%(variable)s --jit threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/Json Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [1059]
      benchmarks:
        - Json:           {extra_args:    25}

    micro-steady:
      gauge_adapter: RebenchLog
      command: &MICRO_STEADY "--jit function_threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/GraphSearch:Examples/Benchmarks/NBody:Examples/Benchmarks/LanguageFeatures:Examples/Benchmarks/TestSuite Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [57]
      benchmarks:
        - Bounce:         {extra_args:    350,  variable_values: [57]}
        - BubbleSort:     {extra_args:    500}
        - Fannkuch:       {extra_args:      9,  variable_values: [57]}
        - Fibonacci:      {extra_args:    500}
        - GraphSearch:    {extra_args:    30}
        - List:           {extra_args:    500}
        - Mandelbrot:     {extra_args:    350,  variable_values: [2]}
        - NBody:          {extra_args:    125000}
        - PageRank:       {extra_args:    350}
        - Permute:        {extra_args:    250}
        - Queens:         {extra_args:    250}
        - QuickSort:      {extra_args:    500}
        - Recurse:        {extra_args:    500}
        - Sieve:          {extra_args:    1250, variable_values: [2]}
        - Storage:        {extra_args:    350,  variable_values: [57]}
        - Sum:            {extra_args:    500}
        - TreeSort:       {extra_args:    350}
        - Towers:         {extra_args:    350}

    # Megamorphic dispatch (the adaptive tier-4 win regime). Each MegaUnaryN /
    # MegaTrivN cycles N receiver classes -- all with a TRIVIAL accessor
    # (`value`/`compute:` returning a literal) -- through one send site. tier 3
    # dispatches this via an O(N) per-class guard/bridge chain (O(N^2) over the
    # do:-loop); tier 4 commits the mega path and residualises it to one O(1)
    # opaque dispatch. Crossover is ~44 classes: measured adaptive/tier3 0.69 @48
    # (+31%), 0.53 @64 (+47%), 0.43 @80 (+57%). This is the canonical PIC /
    # megamorphic workload (Hoelzle); the monomorphic micro/macro suites have no
    # such pathology, so adaptive ~= tier3 there.
    megamorphic-steady:
      gauge_adapter: RebenchLog
      command: &MEGA_STEADY "--jit function_threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/Mega Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [57]
      benchmarks:
        - MegaUnary48:    {extra_args:    40}
        - MegaUnary64:    {extra_args:    40}
        - MegaUnary80:    {extra_args:    40}
        - MegaTriv48:     {extra_args:    40}

    macro-startup:
      gauge_adapter: RebenchLog
      command: &MACRO_CMD "--jit function_threshold=%(variable)s --jit threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/Json Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [1059]
      benchmarks:
        - Json:         {extra_args:      1}

    micro-startup:
      gauge_adapter: RebenchLog
      command: &MICRO_STARTUP_CMD "--jit function_threshold=%(variable)s -cp Smalltalk:Examples/Benchmarks/GraphSearch:Examples/Benchmarks/NBody:Examples/Benchmarks/LanguageFeatures:Examples/Benchmarks/TestSuite Examples/Benchmarks/BenchmarkHarness.som --gc %(benchmark)s %(iterations)s "
      variable_values: [53]
      benchmarks:
        - Bounce:         {extra_args:    10,  variable_values: [57]}
        - BubbleSort:     {extra_args:    10}
        - Fannkuch:       {extra_args:     2,  variable_values: [57]}
        - Fibonacci:      {extra_args:    10}
        - GraphSearch:    {extra_args:    2}
        - List:           {extra_args:    2}
        - Mandelbrot:     {extra_args:    50,  variable_values: [2]}
        - NBody:          {extra_args:  1000}
        - PageRank:       {extra_args:    10}
        - Permute:        {extra_args:    10}
        - Queens:         {extra_args:    10}
        - QuickSort:      {extra_args:    10}
        - Recurse:        {extra_args:    10}
        - Sieve:          {extra_args:    10, variable_values: [2]}
        - Storage:        {extra_args:    10,  variable_values: [57]}
        - Sum:            {extra_args:    10}
        - TreeSort:       {extra_args:    10}
        - Towers:         {extra_args:    10}


executors:
    RPySOM-bc-jit-tier1:
        path: .
        executable: som-bc-jit-tier1
    RPySOM-bc-jit-tier1-no-ic:
        path: .
        executable: som-bc-jit-tier1-no-ic
    RPySOM-bc-jit-tier1-no-ic-no-handler-opt:
        path: .
        executable: som-bc-jit-tier1-no-ic-no-handler-opt
    # NOTE: tier numbering was realigned to the TLA scheme. som-bc-jit-tier2 is
    # now the STACK INLINER (was the tracing JIT); the tracing JIT is now
    # som-bc-jit-tier3 and the adaptive hybrid is som-bc-jit-adaptive.
    RPySOM-bc-jit-tier2:
        path: .
        executable: som-bc-jit-tier2
    RPySOM-bc-jit-tier3:
        path: .
        executable: som-bc-jit-tier3
    RPySOM-bc-jit-adaptive:
        path: .
        executable: som-bc-jit-adaptive
    RPySOM-bc-interp:
        path: .
        executable: som-bc-interp-tier1
    RPySOM-bc-jit-hybrid:
        path: .
        executable: som-bc-jit-hybrid


experiments:
  PySOM:
    description: All benchmarks on RPySOM
    executions:
      - RPySOM-bc-jit-tier1:
          suites:
            - micro-steady
            - macro-steady
            - micro-startup
            - macro-startup
      - RPySOM-bc-jit-tier1-no-ic:
          suites:
            - micro-steady
            - macro-steady
      - RPySOM-bc-jit-tier1-no-ic-no-handler-opt:
          suites:
            - micro-steady
            - macro-steady
      - RPySOM-bc-jit-tier2:
          suites:
            - micro-startup
            - macro-startup
      # Tracing JIT (tier 3) vs adaptive hybrid (tier 4) head-to-head. They match
      # on the monomorphic micro/macro suites (adaptive = tier3 + ~0.3% warmup) and
      # adaptive wins >=20% on megamorphic-steady (its designed regime).
      - RPySOM-bc-jit-tier3:
          suites:
            - micro-steady
            - macro-steady
            - megamorphic-steady
      - RPySOM-bc-jit-adaptive:
          suites:
            - micro-steady
            - macro-steady
            - megamorphic-steady
      - RPySOM-bc-interp:
          suites:
            - micro-steady
            - macro-steady
            - micro-startup
            - macro-startup
